[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alix-backend"
version = "0.1.0"
description = "Luxembourg Parcel Intelligence Platform — backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "geoalchemy2>=0.15",
    "structlog>=24.4",
    "pyshp>=2.3",
    "shapely>=2.0",
    "httpx>=0.27",
    "rasterio>=1.4",
    "numpy>=2",
    "beautifulsoup4>=4.12",
    "python-docx>=1.1",
    "pypdf>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["app*", "ingestion*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI system is built on calling Depends()/Query()/Path() as argument
# defaults — that's the documented, idiomatic pattern, not the mutable-default
# bug B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
# Bumped from 3.11 (our `requires-python` floor) to 3.12: numpy's own bundled
# stubs (pulled in transitively by shapely) use 3.12+ `type` statement syntax
# that mypy cannot even parse under an older target — this is a parser-level
# limit, not something a per-module `ignore_errors` override can suppress.
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["geoalchemy2.*", "shapefile.*", "shapely.*", "rasterio.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# shapely pulls in numpy, whose bundled stubs use 3.12+ syntax mypy can't
# parse under python_version=3.11 — this only silences errors *within*
# numpy's own stubs, not our code.
module = ["numpy.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
