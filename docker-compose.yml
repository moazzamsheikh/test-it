services:
  db:
    build:
      context: ./docker/postgres
    image: alix-postgis-pgvector:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-alix}
    ports:
      # Host 5433 -> container 5432 so it won't collide with a local Postgres.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alix} -d ${POSTGRES_DB:-alix}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
